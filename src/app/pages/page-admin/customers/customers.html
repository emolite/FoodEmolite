<div class="space-y-6">
  <div class="flex items-start justify-between gap-4">
    <div>
      <h1 class="md:text-[20px] font-semibold text-violet-400 uppercase tracking-widest">
        Danh Sách Khách Hàng
      </h1>

      <p class="mt-2 text-md leading-4 text-gray-500">
        Khách hàng đã từng đặt món trên toàn hệ thống ({{ totalRecords() }} khách)
      </p>
    </div>

    <div class="w-64">
      <app-dropdown [options]="storeOptions()" placeholder="Toàn bộ cửa hàng" [value]="selectedStoreRefCode()"
        (changed)="onStoreChange($event)">
      </app-dropdown>
    </div>
  </div>

  <app-filter
    [fields]="filterFields"
    [initialValues]="filter()"
    (filterChange)="onFilterChange($event)">
  </app-filter>
  <div></div>
  <app-table
    [columns]="columns"
    [rows]="rows()"
    [currentPage]="page()"
    [totalPages]="totalPages()"
    [loading]="loading()"
    [sortBy]="sortBy()"
    [asc]="asc()"
    emptyText="Chưa có khách hàng nào"
    (pageChange)="onPageChange($event)"
    (sortChange)="onSortChange($event)">
  </app-table>
</div>
