<div class="space-y-6">
  <div>
    <h1 class="md:text-[20px] font-semibold text-violet-400 uppercase tracking-widest">
      Danh Sách Khách Hàng
    </h1>

    <p class="mt-2 text-md leading-4 text-gray-500">
      Khách hàng đã từng đặt món tại cửa hàng của bạn ({{ totalRecords() }} khách)
    </p>
  </div>

  <app-filter
    [fields]="filterFields"
    [initialValues]="filter()"
    (filterChange)="onFilterChange($event)">
  </app-filter>
  <div></div>
  <app-table
    [columns]="columns"
    [rows]="rows()"
    [currentPage]="page()"
    [totalPages]="totalPages()"
    [loading]="loading()"
    [sortBy]="sortBy()"
    [asc]="asc()"
    emptyText="Chưa có khách hàng nào"
    (pageChange)="onPageChange($event)"
    (sortChange)="onSortChange($event)">
  </app-table>
</div>
